<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f6b45">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>كوستر الجامعة</title>
<!-- مكتبة الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- خط Cairo العصري -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --tx: #0f172a; --mu: #64748b;
  --pr: #059669; --pr-hover: #047857; --on: #ffffff; --bd: #e2e8f0;
  --dn: #ef4444; --ac: #f59e0b;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}
@media(prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a; --card: #1e293b; --tx: #f1f5f9; --mu: #94a3b8;
    --pr: #10b981; --pr-hover: #34d399; --on: #022c22; --bd: #334155;
    --dn: #f87171; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Cairo', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }

/* الهيدر */
header { background: linear-gradient(135deg, var(--pr), var(--pr-hover)); color: var(--on); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
header b { font-size: 20px; font-weight: 800; }
header button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; cursor: pointer; }

main { max-width: 720px; margin: 0 auto; padding: 20px; padding-bottom: 90px; } /* مساحة للشريط السفلي */

/* البطاقات */
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); transition: transform 0.2s; }
h2 { margin: 0 0 14px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.mu { color: var(--mu); font-size: 14px; }

/* المدخلات */
input, select, textarea { width: 100%; padding: 12px 14px; margin: 6px 0 14px; border: 1.5px solid var(--bd); border-radius: 12px; background: var(--bg); color: var(--tx); font-family: 'Cairo', sans-serif; font-size: 15px; transition: border-color 0.2s; }
input:focus, select:focus, textarea:focus { border-color: var(--pr); outline: none; }
label { font-weight: 600; font-size: 14px; }

/* الأزرار */
button { font-family: 'Cairo', sans-serif; cursor: pointer; border: none; border-radius: 12px; padding: 12px 20px; background: var(--pr); color: var(--on); font-weight: 700; font-size: 15px; transition: all 0.2s; }
button:active { transform: scale(0.97); }
button.ghost { background: transparent; color: var(--tx); border: 1.5px solid var(--bd); }
button.sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
button.dn { background: var(--dn); color: #fff; }

/* أزرار الخيارات */
.opt { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: start; background: var(--card); color: var(--tx); border: 2px solid var(--bd); margin-bottom: 10px; padding: 14px 18px; border-radius: 14px; transition: all 0.2s; }
.opt:hover { border-color: var(--pr); }
.opt small { display: block; font-weight: 400; color: var(--mu); font-size: 13px; margin-top: 4px; }
.opt.sel { border-color: var(--pr); background: var(--pr); color: var(--on); box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
.opt.sel small { color: rgba(255,255,255,0.8); }
.opt i { font-size: 20px; }

/* شريط المقاعد */
.progress-container { background: var(--bd); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
.progress-bar { height: 100%; border-radius: 4px; transition: width 0.4s ease, background-color 0.4s; }

/* التنبيهات والشات */
.bub { background: var(--bg); border: 1px solid var(--bd); border-inline-start: 4px solid var(--pr); border-radius: 12px; padding: 12px 16px; margin: 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.bub small { display: block; color: var(--mu); font-size: 12px; margin-bottom: 4px; }
.bub time { display: block; text-align: end; color: var(--mu); font-size: 11px; margin-top: 6px; }

/* الحالات الفارغة */
.empty-state { text-align: center; padding: 30px 10px; color: var(--mu); }
.empty-state i { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }

/* التنبيهات (Toast) */
#msg { position: fixed; bottom: 80px; inset-inline: 20px; max-width: 520px; margin: auto; padding: 14px 20px; border-radius: 12px; z-index: 99; color: #fff; font-weight: 700; box-shadow: var(--shadow-hover); animation: slideUp 0.3s ease-out; }
#msg.ok { background: var(--pr); }
#msg.err { background: var(--dn); }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* شاشة التحميل */
@keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
.spinner { width: 44px; height: 44px; border: 4px solid var(--bd); border-top-color: var(--pr); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* الشريط السفلي (للطالب) */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0 15px; border-top: 1px solid var(--bd); box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 100; }
.bottom-nav a { text-decoration: none; color: var(--mu); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; transition: color 0.2s; cursor: pointer; }
.bottom-nav a i { font-size: 20px; }
.bottom-nav a.active { color: var(--pr); }

/* إخفاء التبويبات غير النشطة */
.tab-content { display: none; animation: fadeIn 0.3s; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* الأدمن */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { flex: 1; background: var(--card); color: var(--mu); border: 1px solid var(--bd); white-space: nowrap; }
.tabs button.on { background: var(--pr); color: var(--on); border-color: var(--pr); }
.stats { display: flex; gap: 10px; margin-bottom: 16px; }
.stats div { flex: 1; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-size: 22px; color: var(--pr); }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 10px 6px; border-bottom: 1px solid var(--bd); text-align: start; font-size: 14px; }
</style>
</head>
<body>
<header>
  <b><i class="fa-solid fa-bus"></i> كوستر الجامعة</b>
  <button id="out" hidden onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</button>
</header>

<!-- شاشة التحميل -->
<main id="app">
  <div id="splash" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 24px;">
    <img src="icon-192.png" alt="كوستر" style="width: 120px; height: 120px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); animation: pulse 1.5s infinite alternate;">
    <div class="spinner"></div>
    <p class="mu" style="font-weight: 700;">جاري التحميل...</p>
  </div>
</main>

<div id="msg" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayStr = n => new Date(Date.now() + n * 864e5).toLocaleDateString('en-CA', {timeZone: 'Asia/Baghdad'});
const toMail = p => p.includes('@') ? p.trim() : p.replace(/\D/g, '') + '@bus.app';
const ERR = {
  'invalid code': 'الرمز غير صحيح أو مستخدم من قبل.',
  'registration closed': 'انتهى وقت التسجيل لهذا اليوم.',
  'no active subscription': 'اشتراكك غير فعال. راجع صاحب الكوستر.',
  'invalid date': 'التاريخ غير مسموح.',
  'Invalid login credentials': 'رقم الهاتف أو كلمة المرور غير صحيحة.',
  'User already registered': 'هذا الرقم مسجل مسبقاً. سجل الدخول.',
  'password too short': 'كلمة المرور قصيرة (6 أحرف على الأقل).',
  'admin only': 'هذه العملية للأدمن فقط.',
  'outbound full': 'مقاعد رحلة الذهاب ممتلئة.',
  'return full': 'مقاعد رحلة العودة ممتلئة.'
};
function msg(t, bad) {
  const m = $('#msg'); m.textContent = ERR[t] || t; m.className = bad ? 'err' : 'ok'; m.hidden = false;
  clearTimeout(msg.t); msg.t = setTimeout(() => m.hidden = true, 4000);
}
const fail = e => msg(e.message || String(e), true);

async function boot() {
  const {data: {session}} = await sb.auth.getSession();
  session ? route(session.user) : authView();
}
async function route(user) {
  $('#out').hidden = false;
  const {data: p, error} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !p) return fail(error || new Error('لم يتم العثور على الملف الشخصي'));
  p.role === 'admin' ? adminView(p) : studentView(p);
}
async function logout() { await sb.auth.signOut(); $('#out').hidden = true; authView(); }

/* ---------- تسجيل الدخول ---------- */
function authView(reg) {
  $('#app').innerHTML = `<div class="card" style="margin-top:40px;"><h2><i class="fa-solid fa-user-lock"></i> ${reg ? 'حساب جديد' : 'تسجيل الدخول'}</h2>
  ${reg ? `<label>الاسم الكامل</label><input id="n" autocomplete="name" placeholder="مثال: أحمد محمد">` : ''}
  <label>رقم الهاتف</label><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXXX">
  <label>كلمة المرور</label><input id="w" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="••••••">
  ${reg ? `<label>رمز الاشتراك</label><input id="c" autocapitalize="characters" style="direction:ltr" placeholder="BUS-XXXX"><p class="mu" style="margin-top:-10px;">يعطيك صاحب الكوستر رمزاً خاصاً بك.</p>` : ''}
  <button onclick="${reg ? 'signUp()' : 'signIn()'}" style="width:100%; margin-top:10px;">${reg ? '<i class="fa-solid fa-user-plus"></i> إنشاء الحساب' : '<i class="fa-solid fa-right-to-bracket"></i> دخول'}</button>
  <p style="text-align:center; margin-top:15px;"><button class="ghost sm" onclick="authView(${!reg})">${reg ? 'عندي حساب' : 'ليس لدي حساب'}</button></p></div>`;
}
async function signIn() {
  const p = $('#p').value, w = $('#w').value;
  if (!p || !w) return msg('أدخل رقم الهاتف وكلمة المرور.', true);
  const {data, error} = await sb.auth.signInWithPassword({email: toMail(p), password: w});
  error ? fail(error) : route(data.user);
}
async function signUp() {
  const n = $('#n').value.trim(), p = $('#p').value, w = $('#w').value, c = $('#c').value.trim();
  if (!n || p.replace(/\D/g, '').length < 7 || w.length < 6 || !c) return msg('أكمل كل الحقول. كلمة المرور 6 أحرف على الأقل.', true);
  const {data, error} = await sb.auth.signUp({email: toMail(p), password: w, options: {data: {full_name: n, phone: p}}});
  if (error) return fail(error);
  if (!data.session) return msg('فعّل Auto Confirm: عطّل Confirm email في Supabase.', true);
  const r = await sb.rpc('redeem_subscription_code', {p_code: c});
  if (r.error) { msg(r.error.message, true); return route(data.user); }
  msg('تم إنشاء الحساب وتفعيل الاشتراك');
  route(data.user);
}

/* ---------- واجهة الطالب ---------- */
const OPTS = [
  [true, true, 'أذهب وأرجع', 'دهوك إلى الموصل ثم العودة', 'fa-arrows-left-right'],
  [true, false, 'أذهب فقط', 'دهوك إلى الموصل', 'fa-arrow-right'],
  [false, true, 'أرجع فقط', 'الموصل إلى دهوك', 'fa-arrow-left'],
  [false, false, 'لا أداوم', 'لا حجز لأي رحلة', 'fa-bed']
];
let ME = null;
let currentTab = 'home'; // لتذكر التبويب المفتوح
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.bottom-nav a').forEach(el => el.classList.remove('active'));
  $(`#tab-${tab}`).classList.add('active');
  $(`#nav-${tab}`).classList.add('active');
}

async function studentView(p) {
  ME = p;
  const {data: sub} = await sb.from('subscriptions').select('route_id,status,end_date').eq('user_id', p.id).maybeSingle();
  
  if (!sub) {
    $('#app').innerHTML = `<div class="card"><h2><i class="fa-solid fa-key"></i> تفعيل الحساب</h2><p>لم يُفعّل اشتراكك بعد. أدخل رمز الاشتراك:</p>
    <input id="c" autocapitalize="characters" style="direction:ltr" placeholder="BUS-XXXX"><button onclick="redeem()" style="width:100%">تفعيل الاشتراك</button></div>`;
    return;
  }

  const d = dayStr(1);
  await sb.rpc('apply_defaults', {p_date: d});
  
  const [a, n, h, w, st] = await Promise.all([
    sb.from('daily_attendance').select('outbound,return_trip,auto').eq('user_id', p.id).eq('attendance_date', d).maybeSingle(),
    sb.from('announcements').select('title,message,created_at').eq('is_active', true).order('created_at', {ascending: false}).limit(30),
    sb.from('daily_attendance').select('attendance_date,outbound,return_trip').eq('user_id', p.id).order('attendance_date', {ascending: false}).limit(14),
    sb.from('weekly_defaults').select('weekday,outbound,return_trip').eq('user_id', p.id),
    sb.rpc('get_seats', {p_route_id: sub.route_id, p_date: d})
  ]);

  const cur = a.data ? `${a.data.outbound}${a.data.return_trip}` : null;
  const expired = sub.end_date && sub.end_date < d, soon = sub.end_date && !expired && sub.end_date <= dayStr(5);
  const off = sub.status !== 'active' || expired;
  const s = st.data && st.data[0], cap = s ? s.capacity : 0;
  const fullO = s && s.outbound_taken >= cap && !a.data?.outbound, fullR = s && s.return_taken >= cap && !a.data?.return_trip;
  const dm = {}; (w.data || []).forEach(x => dm[x.weekday] = (x.outbound ? 't' : 'f') + (x.return_trip ? 't' : 'f'));
  
  let seen = null; try { seen = localStorage.getItem('annSeen'); } catch (e) {}
  const nn = (n.data || []).filter(x => seen && new Date(x.created_at) > new Date(seen)).length;
  const red = t => `<p style="color:var(--dn); font-size:14px; font-weight:600; margin-bottom:10px;"><i class="fa-solid fa-triangle-exclamation"></i> ${t}</p>`;

  // حساب المقاعد والنسبة المئوية
  const remO = cap - (s ? s.outbound_taken : 0);
  const remR = cap - (s ? s.return_taken : 0);
  const pctO = cap ? (remO / cap) * 100 : 0;
  const pctR = cap ? (remR / cap) * 100 : 0;
  
  // لون شريط التقدم (أخضر، أصفر، أحمر)
  const barColor = pct => pct > 40 ? 'var(--pr)' : pct > 10 ? 'var(--ac)' : 'var(--dn)';

  $('#app').innerHTML = `
  <!-- التبويب الأول: الرئيسية -->
  <div id="tab-home" class="tab-content ${currentTab === 'home' ? 'active' : ''}">
    <div class="card">
      <h2><i class="fa-regular fa-calendar-check"></i> دوام الغد</h2>
      <p class="mu" style="margin-top:-10px;">${esc(p.full_name)} · ${d}</p>
      ${sub.status !== 'active' ? red('اشتراكك موقوف. راجع صاحب الكوستر.') : expired ? red('انتهى اشتراكك. جدّد لتأكيد الدوام.') : soon ? red(`ينتهي اشتراكك في ${sub.end_date}.`) : ''}
      
      ${s ? `
      <!-- أشرطة المقاعد المتبقية -->
      <div style="margin-bottom: 20px; background: var(--bg); padding: 15px; border-radius: 12px;">
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;">
          <span><i class="fa-solid fa-bus"></i> ذهاب</span>
          <span style="color:${barColor(pctO)}">${Math.max(0, remO)} مقعد</span>
        </div>
        <div class="progress-container"><div class="progress-bar" style="width:${pctO}%; background:${barColor(pctO)}"></div></div>
        
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-top:12px; margin-bottom:6px;">
          <span><i class="fa-solid fa-bus-simple"></i> عودة</span>
          <span style="color:${barColor(pctR)}">${Math.max(0, remR)} مقعد</span>
        </div>
        <div class="progress-container"><div class="progress-bar" style="width:${pctR}%; background:${barColor(pctR)}"></div></div>
      </div>` : ''}

      ${OPTS.map(o => { const full = (o[0] && fullO) || (o[1] && fullR);
        return `<button class="opt ${cur === `${o[0]}${o[1]}` ? 'sel' : ''}" ${off || full ? 'disabled' : ''} onclick="setAtt('${sub.route_id}','${d}',${o[0]},${o[1]})">
          <div>
            <b>${o[2]}</b>
            <small>${o[3]}${full ? ' · ممتلئ' : ''}</small>
          </div>
          <i class="fa-solid ${o[4]}"></i>
        </button>`; }).join('')}
      ${a.data?.auto ? '<p class="mu" style="text-align:center;"><i class="fa-solid fa-robot"></i> تم التأكيد تلقائياً من جدولك الثابت.</p>' : ''}
    </div>

    <div class="card">
      <h2><i class="fa-solid fa-calendar-days"></i> جدولي الثابت</h2>
      <p class="mu" style="margin-top:-10px;">يتأكد دوامك تلقائياً حسب هذا الجدول.</p>
      ${DAYS.map((nm, i) => `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bd); padding:8px 0;">
        <span style="font-weight:600;">${nm}</span>
        <select style="width:auto; margin:0; padding:6px 12px; border-radius:8px;" onchange="setDef(${i},this.value)">
          ${[['', 'بدون'], ['tt', 'أذهب وأرجع'], ['tf', 'أذهب فقط'], ['ft', 'أرجع فقط']].map(o => `<option value="${o[0]}" ${(dm[i] || '') === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
        </select>
      </div>`).join('')}
    </div>
  </div>

  <!-- التبويب الثاني: التنبيهات -->
  <div id="tab-ann" class="tab-content ${currentTab === 'ann' ? 'active' : ''}">
    <div class="card">
      <h2><i class="fa-solid fa-bullhorn"></i> التنبيهات ${nn ? `<span class="badge" style="background:var(--dn);color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;">${nn} جديد</span>` : ''}</h2>
      <div id="ann-list">${annHtml(n.data, false, seen)}</div>
    </div>
    <div class="card">
      <h2><i class="fa-solid fa-mobile-screen"></i> إشعارات الهاتف</h2>
      <div id="pushbox"></div>
    </div>
  </div>

  <!-- التبويب الثالث: السجل -->
  <div id="tab-hist" class="tab-content ${currentTab === 'hist' ? 'active' : ''}">
    <div class="card">
      <h2><i class="fa-solid fa-clock-rotate-left"></i> سجل دوامك</h2>
      ${histRows(h.data)}
    </div>
  </div>

  <!-- التبويب الرابع: حسابي -->
  <div id="tab-profile" class="tab-content ${currentTab === 'profile' ? 'active' : ''}">
    <div class="card">
      <h2><i class="fa-solid fa-user"></i> حسابي</h2>
      <p><b>الاسم:</b> ${esc(p.full_name)}</p>
      <p><b>الهاتف:</b> <span dir="ltr">${esc(p.phone)}</span></p>
      <p><b>حالة الاشتراك:</b> ${sub.status === 'active' && !expired ? '<span style="color:var(--pr)">فعال</span>' : '<span style="color:var(--dn)">غير فعال</span>'}</p>
      <p><b>تاريخ الانتهاء:</b> ${sub.end_date || 'غير محدد'}</p>
    </div>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a id="nav-home" class="${currentTab === 'home' ? 'active' : ''}" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> الرئيسية</a>
    <a id="nav-ann" class="${currentTab === 'ann' ? 'active' : ''}" onclick="switchTab('ann')"><i class="fa-solid fa-bell"></i> التنبيهات</a>

function exportCsv() {
  const q = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const lines = [['الاسم', 'الهاتف', 'ذهاب', 'عودة'].map(q).join(',')].concat(lastRows.map(r =>

  a.click();
}

const VAPID_PUBLIC_KEY = 'BFtCcBjsSsNv7fGWMimDNQ8EM8KzhVGCb3LmxLER7doM5d1RVNqtDJvN0RKWkqnoCtWr5XpTiRtPpzQJ_2Ykdes';
const b64 = t => Uint8Array.from(atob((t + '='.repeat((4 - t.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pushBox() {
  const el = $('#pushbox'); if (!el) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), app = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    el.innerHTML = ios && !app ? '<p class="mu">على الأيفون: افتح الموقع بسفاري، اضغط زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"، وافتح التطبيق من الشاشة الرئيسية لتفعيل الإشعارات.</p>' : '<p class="mu">متصفحك لا يدعم الإشعارات.</p>';
    return;
  }
  if (Notification.permission === 'denied') { el.innerHTML = '<p class="mu">الإشعارات محظورة. فعّلها من إعدادات المتصفح لهذا الموقع.</p>'; return; }
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  el.innerHTML = sub && Notification.permission === 'granted'
    ? '<p style="color:var(--pr);font-weight:600;margin-top:-10px;"><i class="fa-solid fa-circle-check"></i> الإشعارات مفعّلة على هذا الجهاز</p><button class="sm ghost" onclick="disablePush()">إيقاف</button>'

}
async function enablePush() {
  try {
    if (await Notification.requestPermission() !== 'granted') return msg('لم يُسمح بالإشعارات. فعّلها من إعدادات المتصفح.', true);
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC_KEY)});
    const {error} = await sb.from('push_subscriptions').upsert({user_id: ME.id, endpoint: sub.endpoint, subscription_data: sub.toJSON()}, {onConflict: 'endpoint'});
    if (error) throw error;
    msg('تم تفعيل الإشعارات'); pushBox();

async function disablePush() {
  try {

}
