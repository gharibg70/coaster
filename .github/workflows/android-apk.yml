name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check browser bundle for server secrets
        run: npm run check:client-secrets

      - name: Run tests
        run: npm test

      - name: Build web assets and sync Capacitor Android project
        run: npm run sync:android
        env:
          VITE_SUPABASE_URL: https://bjrpmuwzbcaebhepakdb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_pPGzlX06HCMy1zTDd5XXnA_xpWE5b4y

      - name: Scan built web assets for server secrets
        run: npm run check:client-secrets

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Scan APK for server secrets
        run: npm run check:android-apk -- android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and foreground location permissions
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          grep -F "package: name='com.gharibg70.coaster'" <<<"$BADGING"
          grep -F "application-label:'كوستر الجامعة'" <<<"$BADGING"
          grep -F 'android.permission.ACCESS_COARSE_LOCATION' <<<"$PERMISSIONS"
          grep -F 'android.permission.ACCESS_FINE_LOCATION' <<<"$PERMISSIONS"
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE_LOCATION' <<<"$PERMISSIONS"; then
            echo 'Unexpected background location permission in APK.' >&2
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coaster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
